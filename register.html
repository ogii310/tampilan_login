<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Form</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS Register -->
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="register-box">

        <div class="icon">
            📝
        </div>

        <h1>Create Account</h1>
        <p class="subtitle">Buat akun baru untuk melanjutkan</p>

        <form id="registerForm">

            <div class="input-group">
                <label for="nama_lengkap">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama_lengkap"
                    name="nama_lengkap"
                    placeholder="Masukkan nama lengkap"
                    required
                >
            </div>

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="konfirm_password">Konfirmasi Password</label>
                <input
                    type="password"
                    id="konfirm_password"
                    name="konfirm_password"
                    placeholder="Masukkan kembali password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="tanggal_lahir">Tanggal Lahir</label>
                <input
                    type="date"
                    id="tanggal_lahir"
                    name="tanggal_lahir"
                    required
                >
            </div>

            <div class="input-group">
                <label for="kelas">Kelas</label>

                <select id="kelas" name="kelas" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="XI PPLG 1">XI PPLG 1</option>
                    <option value="XI PPLG 2">XI PPLG 2</option>
                    <option value="XI PPLG 3">XI PPLG 3</option>
                    <option value="XI PPLG 4">XI PPLG 4</option>
                    <option value="XI PPLG 5">XI PPLG 5</option>
                    <option value="XI PPLG 6">XI PPLG 6</option>
                </select>
            </div>

            <div class="input-group">
                <label>Jenis Kelamin</label>

                <div class="gender">

                    <label>
                        <input
                            type="radio"
                            name="jenis_kelamin"
                            value="Laki-Laki"
                            required
                        >
                        Laki-Laki
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="jenis_kelamin"
                            value="Perempuan"
                        >
                        Perempuan
                    </label>

                </div>
            </div>

            <button type="submit">Daftar</button>

        </form>

        <p class="login-link">
            Sudah punya akun?
            <a href="index.html">Login sekarang</a>
        </p>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
